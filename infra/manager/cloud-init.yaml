#cloud-config
package_update: true
packages: [git, gh, jq, nodejs, npm, ripgrep, fd-find, cargo, rustfmt, rust-clippy]

users:
  - name: manager
    shell: /bin/bash

write_files:
  - path: /home/manager/.pi/agent/models.json
    owner: manager:manager
    defer: true
    content: |
      {
        "providers": {
          "local": {
            "baseUrl": "${model_endpoint}",
            "api": "openai-completions",
            "apiKey": "none",
            "compat": { "supportsDeveloperRole": false, "supportsReasoningEffort": false },
            "models": [
              { "id": "${model_id}", "reasoning": true, "thinkingLevelMap": { "off": null },
                "contextWindow": 131072, "maxTokens": 8192, "input": ["text"] }
            ]
          }
        }
      }
  - path: /home/manager/.pi/agent/settings.json
    owner: manager:manager
    defer: true
    # The long timeout matters: the model serves one request at a time, so ours may
    # queue behind someone else's. A short timeout would turn waiting into errors.
    content: |
      {
        "defaultProvider": "local",
        "defaultModel": "${model_id}",
        "quietStartup": true,
        "retry": { "enabled": true, "maxRetries": 1, "provider": { "timeoutMs": 1800000, "maxRetries": 0 } }
      }
  - path: /home/manager/manager.env
    owner: manager:manager
    permissions: "0600"
    defer: true
    content: |
      GH_TOKEN=${manager_token}
      REPO=${repo}
      PI_SKIP_VERSION_CHECK=1
  - path: /home/manager/poll.sh
    owner: manager:manager
    permissions: "0755"
    defer: true
    content: |
      ${poll_script}
  - path: /home/manager/PROMPT.md
    owner: manager:manager
    defer: true
    content: |
      ${prompt}
  - path: /etc/systemd/system/manager.service
    content: |
      [Unit]
      Description=Speedrun Evals manager: handle new GitHub notifications
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=manager
      EnvironmentFile=/home/manager/manager.env
      ExecStart=/home/manager/poll.sh
  - path: /etc/systemd/system/manager.timer
    content: |
      [Timer]
      OnBootSec=2min
      OnUnitInactiveSec=15min

      [Install]
      WantedBy=timers.target

runcmd:
  - npm install -g @earendil-works/pi-coding-agent@1.1.0
  - sudo -u manager git config --global user.name "Speedrun Evals manager"
  - sudo -u manager git config --global user.email "manager@speedrun-evals.invalid"
  - systemctl daemon-reload
  - systemctl enable --now manager.timer
