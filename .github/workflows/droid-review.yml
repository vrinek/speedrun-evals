# factory-automation: 8a76be27-9f82-4bc2-b39a-a0002c5bc262
name: Droid Code Review
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: shallow
          allowed_bots: factory-droid
